<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Vendas AAPM</title>
    <link rel="stylesheet" href="/apps/pvd/styles/base.css">
    <link rel="icon" type="image/png" href="../assets/icones/logosemtexto.png?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="topbar">
        <div class="logo">
            <img src="/apps/pvd/assets/icones/logotransparente.png" alt="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Carrinho</a></li>
            </ul>
        </nav>

        <div class="topbar-icons">
            <div class="topbar-icon">
                <i class="fa-regular fa-bell"></i>
                <span class="badge">2</span>
            </div>
            <div class="topbar-icon">
                <i class="fa-solid fa-gear"></i>
            </div>
            <div class="topbar-profile">
                <div class="avatar"></div>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </header>
    <!-- Layout Principal -->
    <div class="layout">
        <!-- Sidebar Esquerda -->
        <aside class="sidebar">
            <div class="categoria">
                <div class="categoria-content">
                    <h2 class="categoria-title">Categorias:</h2>

                    <button class="cat-btn cat-active" data-category="materiais-escolares">
                        <i class="fa-solid fa-box-open"></i>
                        <span>Materiais Escolares <em>(84)</em></span>
                    </button>
                    <button class="cat-btn" data-category="uniformes">
                        <i class="fa-solid fa-shirt"></i>
                        <span>Uniformes <em>(23)</em></span>
                    </button>
                    <button class="cat-btn" data-category="materiais-texteis">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Materiais Têxteis <em>(42)</em></span>
                    </button>
                    <button class="cat-btn" data-category="ferramentas">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        <span>Ferramentas <em>(19)</em></span>
                    </button>
                </div>
            </div>

            <button class="painel-admin">
                <i class="fa-solid fa-gear"></i>
                Painel Administrativo
            </button>
        </aside>

        <!-- Conteúdo Central -->
        <main class="content">
            <div class="breadcrumb">
                <a href="#">Página Inicial</a>
                <i class="fa-solid fa-chevron-right"></i>
                <span>Produtos</span>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-left"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar produtos...">
                <i class="fa-solid fa-magnifying-glass search-right"></i>
            </div>

            <h1 class="section-title">
                <span id="categoryName">Materiais Escolares</span> 
                <span class="product-count">(6)</span>
            </h1>

            <!-- Grid de Produtos -->
            <section id="productsGrid" class="products-grid">
                <!-- Produtos serão inseridos aqui via JavaScript -->
            </section>

            <!-- Paginação -->
            <div class="pagination">
                <span class="result-count" id="resultCount">1-6 de 6 resultados</span>
                <div class="pages">
                    <button class="page-nav" id="prevPage" disabled>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="pageNumbers"></div>
                    <button class="page-nav" id="nextPage" disabled>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Carrinho de Compras -->
        <aside class="cart">
            <h2 class="cart-title">
                Carrinho de Compras
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
            </h2>

            <div id="cartItems" class="cart-items">
                <!-- Itens do carrinho serão inseridos aqui -->
            </div>

            <div class="cart-total">
                <span class="total-label">Total <strong id="cartTotal">R$ 0,00</strong></span>
                <span class="total-discount" id="cartDiscount">-R$ 0,00</span>
            </div>

            <div class="cart-associate">
                <i class="fa-solid fa-circle-check"></i>
                Associado
                <i class="fa-solid fa-chevron-down dropdown-icon"></i>
            </div>

            <button class="btn-close-order">Fechar Pedido</button>
            <button class="btn-view-cart">Ver Carrinho</button>
        </aside>
    </div>

    <script src="/apps/pvd/scripts/base.js"></script>
    <div class="background-image"></div>
</body>
</html>
