<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM - Ponto de Venda</title>
    <link rel="stylesheet" href="/apps/pvd/styles/base.css">
    <link rel="icon" type="image/png" href="/apps/pvd/assets/icones/logosemtexto.png?v=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>
    <canvas id="particles"></canvas>

    <header class="topbar">
        <div class="logo">
            <img src="/apps/pvd/assets/icones/banner_aapm.png" alt="AAPM">
            <div class="topbar-title">
                <strong>Ponto de Venda</strong>
                <span>{{ usuario.nome or usuario.sub }}</span>
            </div>
        </div>

        <nav class="top-nav" aria-label="Navegacao principal">
            <ul>
                <li><a href="/dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
                <li><a href="/pdv" class="active"><i class="fa-solid fa-cash-register"></i> Ponto de Venda</a></li>
            </ul>
        </nav>

        <div class="topbar-actions">
            <a class="topbar-link" href="/auth/logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="categoria">
                <div class="categoria-content">
                    <h2 class="categoria-title">Categorias</h2>
                    <button class="cat-btn cat-active" data-category="todos">
                        <i class="fa-solid fa-list"></i>
                        <span>Todos <em class="cat-count" data-category="todos">(0)</em></span>
                    </button>
                    <div id="categoryButtons"></div>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="breadcrumb">
                <i class="fa-solid fa-cash-register"></i>
                <span>Venda em andamento</span>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-left"></i>
                <input type="text" id="searchInput" placeholder="Buscar produto por nome ou categoria...">
            </div>

            <h1 class="section-title">
                <span id="categoryName">Todos os Produtos</span>
                <span class="product-count">(0)</span>
            </h1>

            <section id="productsGrid" class="products-grid"></section>

            <div class="pagination">
                <span class="result-count" id="resultCount">0-0 de 0 resultados</span>
                <div class="pages">
                    <button class="page-nav" id="prevPage" disabled>
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="pageNumbers"></div>
                    <button class="page-nav" id="nextPage" disabled>
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>

        <aside class="cart">
            <h2 class="cart-title">
                Carrinho
                <i class="fa-solid fa-cart-shopping cart-icon"></i>
            </h2>

            <div id="cartItems" class="cart-items"></div>

            <button type="button" id="btnToggleAssociado" class="cart-associate">
                <i class="fa-regular fa-circle"></i>
                <span>Associado AAPM (10%)</span>
            </button>

            <div class="payment-box">
                <span class="payment-title">Pagamento</span>
                <div class="payment-options" id="paymentOptions">
                    <button type="button" class="payment-option active" data-payment="pix"><i class="fa-brands fa-pix"></i> Pix</button>
                    <button type="button" class="payment-option" data-payment="debito"><i class="fa-solid fa-credit-card"></i> Debito</button>
                    <button type="button" class="payment-option" data-payment="credito"><i class="fa-regular fa-credit-card"></i> Credito</button>
                    <button type="button" class="payment-option" data-payment="dinheiro"><i class="fa-solid fa-money-bill-wave"></i> Dinheiro</button>
                </div>
            </div>

            <div class="cart-total">
                <span class="total-label">Total Geral: <strong id="cartTotal">R$ 0,00</strong></span>
                <span class="total-discount" id="cartDiscount">-R$ 0,00</span>
            </div>

            <button type="button" id="btnFecharPedido" class="btn-close-order">
                <i class="fa-solid fa-file-invoice-dollar"></i> Fechar Pedido
            </button>
        </aside>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
    <div class="background-image"></div>

    <script src="/apps/pvd/scripts/base.js"></script>
</body>

</html>
