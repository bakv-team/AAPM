<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM - Redefinir senha</title>
    <script>
        try {
            if (localStorage.getItem("aapm_theme") === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        } catch (error) {}
    </script>
    <link rel="stylesheet" href="/apps/pvd/styles/login.css?v=login-microinteractions-20260605-1">
    <link rel="icon" type="image/png" href="/apps/pvd/assets/icones/logosemtexto.png?v=1">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <canvas></canvas>
    <div class="background-image"></div>
    <div class="blur blue"></div>
    <div class="blur orange"></div>

    <main class="container reset-container">
        <section class="right-side reset-side">
            <div class="login-card reset-card">
                <div class="line"></div>
                <div class="header">
                    <h3>Redefinir senha</h3>
                    <p>Informe uma nova senha para continuar acessando o sistema.</p>
                </div>

                {% if sucesso %}
                    <p class="auth-feedback success">{{ sucesso }}</p>
                    <a class="login-btn reset-link" href="/auth/login">
                        <span>Voltar para login</span>
                        <i data-lucide="arrow-right"></i>
                    </a>
                {% elif erro and not token %}
                    <p class="auth-feedback error">{{ erro }}</p>
                    <a class="login-btn reset-link" href="/auth/login">
                        <span>Voltar para login</span>
                        <i data-lucide="arrow-right"></i>
                    </a>
                {% else %}
                    {% if erro %}
                        <p class="auth-feedback error">{{ erro }}</p>
                    {% endif %}
                    <form action="/auth/reset-password" method="post" id="resetPasswordForm">
                        <input type="hidden" name="token" value="{{ token }}">

                        <div class="input-box">
                            <i data-lucide="lock"></i>
                            <input type="password" name="senha" id="resetPasswordInput" placeholder="Nova senha" required minlength="6" autocomplete="new-password">
                            <button class="password-toggle" id="resetPasswordToggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>

                        <div class="input-box">
                            <i data-lucide="shield-check"></i>
                            <input type="password" name="confirmar_senha" id="resetConfirmInput" placeholder="Confirmar senha" required minlength="6" autocomplete="new-password">
                        </div>

                        <button type="submit" class="login-btn">
                            <span>Salvar nova senha</span>
                            <i data-lucide="check"></i>
                        </button>
                    </form>
                {% endif %}
            </div>
        </section>
    </main>

    <script src="/apps/pvd/scripts/login.js?v=password-reset-20260604-1"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
