<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Usuário — Estoque</title>
</head>
<body>
    <h1>Novo Usuário</h1>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form action="/usuarios/novo" method="post">
        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" value="{{ valores.nome if valores else '' }}" required>
        </p>

        <p>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" value="{{ valores.email if valores else '' }}" required>
        </p>

        <p>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
        </p>

        <p>
            <label for="role">Perfil:</label><br>
            <select id="role" name="role" required>
                <option value="admin" {{ 'selected' if (valores and valores.role == 'admin') else '' }}>admin</option>
                <option value="operador" {{ 'selected' if (valores and valores.role == 'operador') else '' }}>operador</option>
            </select>
        </p>

        <p>
            <label>
                <input type="checkbox" name="ativo" value="on" {% if valores and valores.ativo %}checked{% endif %}>
                Usuário Ativo
            </label>
        </p>

        <br>
        <button type="submit">Criar Usuário</button>
        <a href="/usuarios" style="margin-left: 10px;">Cancelar</a>
    </form>

    <hr>
    <p><a href="/usuarios">← Voltar para a lista</a></p>
</body>
</html>
